<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Office Course | Sher's Study Centre</title>
    <style>
        body { 
            font-family: "Century Gothic", sans-serif; 
            margin: 0; padding: 0; 
            background-color: #fdfbf7;
            background-image: radial-gradient(#dcd5c5 1px, transparent 1px);
            background-size: 20px 20px;
            color: #333; line-height: 1.6;
        }

        /* Fixed Header */
        .logo-container {
            display: flex; align-items: center; justify-content: space-between;
            height: 90px; background: #fdfbf7; 
            position: fixed; top: 0; left: 0; right: 0; 
            z-index: 1000; padding: 0 20px;
            border-bottom: 3px solid #D4AF37;
        }

        /* Hover-based Hamburger Menu */
        .menu-trigger { cursor: pointer; position: relative; padding: 10px; }
        .line { width: 30px; height: 3px; background: #87CEEB; margin: 5px 0; }
        
        .dropdown {
            display: none; position: absolute; left: 0; top: 50px;
            background: #fff; min-width: 150px; box-shadow: 0px 8px 16px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        /* Show menu on hover */
        .menu-trigger:hover .dropdown { display: block; }
        
        .dropdown a { display: block; padding: 12px 20px; color: #333; text-decoration: none; border-bottom: 1px solid #eee; }
        .dropdown a:hover { background: #87CEEB; color: white; }

        section { padding: 20px; max-width: 800px; margin: auto; scroll-margin-top: 100px; }
        h2 { color: #D4AF37; border-bottom: 2px solid #87CEEB; padding-bottom: 5px; }
        
        .footer-band { background-color: #87CEEB; color: white; text-align: center; padding: 30px 20px; margin-top: 40px; border-top: 5px solid #D4AF37; }
    </style>
</head>
<body>

    <div class="logo-container">
        <div class="menu-trigger">
            <div class="line"></div><div class="line"></div><div class="line"></div>
            <div class="dropdown">
                <a href="#book-a-lesson">Book a Lesson</a>
                <a href="PASTE_YOUR_LINK_HERE">Courses</a>
            </div>
        </div>
        
        <img src="logo.png" alt="Logo" style="height:60px;">
    </div>

    <div style="padding-top: 100px;"></div>

    <section id="about">
        <h2>About the Course</h2>
        <p>Your content here...</p>
    </section>

    </body>
</html>
